name: fframe
description: Desktop-first framework with FFrame-owned layouts, WPF styling, and F-prefixed controls.
version: 0.2.0
homepage: https://pub.dev/packages/fframe
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  fframe_layout:
    ^0.2.0
  fframe_design:
    ^0.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: FFrameSymbols
      fonts:
        - asset: assets/fonts/FFrameSymbols.otf
