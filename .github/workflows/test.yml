name: test

on:
  push:
  pull_request:

jobs:
  package-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [packages/fframe_layout]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run melos bootstrap
      - run: dart format --set-exit-if-changed lib test
        working-directory: ${{ matrix.package }}
      - run: flutter test
        working-directory: ${{ matrix.package }}

  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run melos bootstrap
      - run: dart format --set-exit-if-changed lib test benchmark
        working-directory: examples/showcase
      - run: flutter test
        working-directory: examples/showcase

  web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v1
      - run: dart pub get
      - run: dart run melos bootstrap
      - run: flutter test --platform chrome
        working-directory: packages/fframe_layout
